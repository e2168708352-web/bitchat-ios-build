name: Build unsigned bitchat iOS IPA

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "bitchat git ref (branch, tag, or commit SHA)"
        required: false
        default: "main"
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build unsigned iOS IPA
    runs-on: macos-26
    timeout-minutes: 90

    steps:
      - name: Checkout bitchat
        uses: actions/checkout@v4
        with:
          repository: permissionlesstech/bitchat
          ref: ${{ github.event.inputs.source_ref }}
          path: src
          fetch-depth: 1

      - name: Record source provenance
        working-directory: src
        run: |
          git rev-parse HEAD | tee "$GITHUB_WORKSPACE/source-commit.txt"
          git log -1 --format='%H%n%ci%n%s' | tee "$GITHUB_WORKSPACE/source-commit-info.txt"

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build for device without signing
        working-directory: src
        run: |
          set -o pipefail
          xcodebuild \
            -project bitchat.xcodeproj \
            -scheme "bitchat (iOS)" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build 2>&1 | tee build.log

      - name: Package unsigned IPA
        working-directory: src
        run: |
          set -euo pipefail
          APP="build/DerivedData/Build/Products/Release-iphoneos/bitchat.app"
          test -d "$APP"
          rm -rf build/Payload
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          cd build
          ditto -c -k --sequesterRsrc --keepParent Payload "$GITHUB_WORKSPACE/bitchat-unsigned.ipa"
          cd "$GITHUB_WORKSPACE"
          shasum -a 256 bitchat-unsigned.ipa | tee bitchat-unsigned.ipa.sha256
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" \
            "$GITHUB_WORKSPACE/src/build/DerivedData/Build/Products/Release-iphoneos/bitchat.app/Info.plist" \
            | tee bundle-id.txt
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" \
            "$GITHUB_WORKSPACE/src/build/DerivedData/Build/Products/Release-iphoneos/bitchat.app/Info.plist" \
            | tee version.txt
          unzip -l bitchat-unsigned.ipa | tee ipa-contents.txt

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: bitchat-unsigned-ipa
          path: |
            bitchat-unsigned.ipa
            bitchat-unsigned.ipa.sha256
            source-commit.txt
            source-commit-info.txt
            bundle-id.txt
            version.txt
            ipa-contents.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log
          path: src/build.log
          if-no-files-found: ignore
          retention-days: 7
